name: validate

# Everything here must run without Office installed. The integration suite
# drives Word through COM and cannot run on a hosted runner (see
# docs/repo-restructure.md §1, constraint C5) — it stays a local gate until a
# self-hosted Windows runner with an Office licence exists.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No package.json anywhere (constraint C2), so there is nothing to
      # install and no cache key to derive.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check extension packaging invariants (C1-C4)
        run: node tools/validate-extensions.mjs

      # A probe cited by an ADR is that claim's evidence. Work here is split
      # across sibling worktrees, so a probe run by the coordinator can resolve
      # on disk while living on another branch — the citation then dangles for
      # everyone else. This asks git, not the filesystem, for exactly that
      # reason.
      - name: Check every probe citation resolves
        run: node tools/check-citations.mjs

      # `node --test <dir>` fails to resolve modules on some Node versions;
      # the quoted glob is the form that works.
      - name: Run Office-free unit tests
        run: node --test ".github/extensions/office-canvas/test/unit/*.test.mjs"
