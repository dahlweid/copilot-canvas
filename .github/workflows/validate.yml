name: validate

# Everything here must run without Office installed. The unit suite under
# .github/extensions/office-canvas/test/unit/ is Office-free and runs below; the
# integration suite drives Word through powershell.exe and cannot run on a
# hosted runner — it stays a local gate until a self-hosted Windows runner with
# an Office licence exists.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No package.json anywhere (constraint C2), so there is nothing to
      # install and no cache key to derive.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check extension packaging invariants (C1-C4)
        run: node tools/validate-extensions.mjs

      # A probe cited by an ADR is that claim's evidence. Work here is split
      # across sibling worktrees, so a probe run by the coordinator can resolve
      # on disk while living on another branch — the citation then dangles for
      # everyone else. This asks git, not the filesystem, for exactly that
      # reason.
      - name: Check every probe citation resolves
        run: node tools/check-citations.mjs

      # The line-number half of #160(a). This is deliberately a separate step
      # from the one above: that one is *filename-only* and has no notion of a
      # line, so a citation naming a real file at a dead line passes it. Until
      # this step existed the tool was built, unit-tested and never run against
      # this repository, while ADR 0009 and `.github/copilot-instructions.md`
      # both stated that it gated committed coordinates (#169).
      #
      # Its unit tests cannot stand in for this step. They run the checker
      # against synthetic in-memory fixtures on purpose — "the fixtures are
      # local to this file so nothing another worktree owns is touched" — which
      # proves the checker works, not that the tree is clean.
      #
      # Read a green run as the tool itself defines it, and no wider: no
      # citation **that this checker recognises** names a missing file, an
      # ambiguous file, or an out-of-range line. A coordinate is in range only
      # if `1 <= lo <= hi <= lineCount`, so `:0` and a reversed `:99-1` are
      # rejected too, not just a high bound past EOF. Its matcher recognises a
      # filename ending `.mjs`, `.ps1`, `.js`, `.ts` or `.md` followed by `:NN`
      # or `:NN-NN`, so a coordinate into any other file type — `validate.yml:99`,
      # a `.json`, a `.txt` — is not checked at all. That whitelist is
      # deliberate, not an oversight: matching any extension would start
      # matching things that are not filenames.
      #
      # It is also not a claim that every citation is correct. A coordinate
      # landing on real but unrelated code passes here and cannot be caught
      # mechanically.
      - name: Check every positional citation resolves
        run: node tools/check-citation-lines.mjs

      # `node --test <dir>` fails to resolve modules on some Node versions, so the
      # file set is expanded by the shell and handed to Node as discrete
      # arguments. That is deliberate: passing a *pattern* means two different
      # globbers decide what runs, and **a pattern Node matches nothing with runs
      # nothing and exits 0**. Measured here: `node --test "**/test/unit/*.test.mjs"`
      # reports `tests 0` and exits 0, because `**` does not descend into the
      # dot-directory `.github`. A green run that tested nothing is the one CI
      # result nobody looks twice at.
      #
      # So there is one globber and two checks, both on the file list, because
      # the file list is the only place a check can live. Node's summary is no
      # help for either case, but for two different reasons:
      #
      #   * everything lost -- measured, a file containing no `test()` calls is
      #     still reported as `tests 1`, so "collected zero tests" is not a state
      #     reachable once the file list is known to be non-empty;
      #   * *some* files lost -- the summary would report a smaller but entirely
      #     plausible number, and there is no expected count to compare it
      #     against. The `tests 1` quirk is not what defeats this one; the
      #     absence of a baseline is.
      #
      # Hence the second check. `*.test.mjs` does not descend, so a test added
      # under test/unit/<subdir>/ would never be handed to Node while the count
      # stayed plausible. `find` only counts; the shell still expands the list
      # Node receives, so the property above is unchanged. A mismatch is a hard
      # error rather than a silent widening: absorbing the subdirectory would
      # make the layout change invisible in the other direction, whereas failing
      # puts it in front of whoever moved the file.
      #
      # Order matters. `find` runs *after* the empty check: a missing directory
      # makes it exit non-zero, and under `set -e` that would abort the step
      # before the annotation naming that exact cause was ever printed
      # (measured). `-printf '.' | wc -c` counts files; `wc -l` would count
      # lines, which a newline in a filename breaks.
      #
      # The second message names no cause, because the check establishes none:
      # it compares two counts. There are at least two routes to a disagreement,
      # both measured -- a file in a subdirectory, and a `.dot.test.mjs` sitting
      # *flat*, which `find -name '*.test.mjs'` matches and the shell's `*` does
      # not without `dotglob` (glob 2, find 3, zero subdirectories). Saying "in a
      # subdirectory" would send a reader hunting one that need not exist. For
      # the same reason it reports both counts rather than their difference:
      # subtracting presumes a direction the check has not established.
      - name: Run Office-free unit tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir=.github/extensions/office-canvas/test/unit
          files=("$dir"/*.test.mjs)
          echo "unit test files: ${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no unit test files found; the path moved and nothing would have run"
            exit 1
          fi
          all=$(find "$dir" -name '*.test.mjs' -printf '.' | wc -c)
          if [ "${#files[@]}" -ne "$all" ]; then
            echo "::error::flat glob and recursive count disagree: the glob hands Node ${#files[@]} file(s), find matches $all under $dir. The check compares counts and does not establish why they differ; a file in a subdirectory and a leading-dot filename are both routes the glob misses and find does not."
            exit 1
          fi
          node --test "${files[@]}"
